services:
  app:
    build:
      context: .
      dockerfile: docker/common/php-fpm/Dockerfile
    container_name: laravel-app-dev
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - laravel-network

  webserver:
    image: nginx:alpine
    container_name: laravel-nginx-dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    container_name: laravel-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-network

  node:
    image: node:20-alpine
    container_name: laravel-node-dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/node_modules
    ports:
      - "5173:5173"
    networks:
      - laravel-network
    command: sh -c "npm install && npm run dev"

networks:
  laravel-network:
    driver: bridge

volumes:
  dbdata:
    driver: local